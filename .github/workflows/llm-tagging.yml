name: Source workout model review
on: workflow_dispatch
permissions:
  contents: read
jobs:
  propose:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --locked
      - name: Propose source selections for unresolved posts
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: uv run --no-sync python scripts/run_review_batch.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-workout-review
          path: review-output/
          if-no-files-found: ignore
