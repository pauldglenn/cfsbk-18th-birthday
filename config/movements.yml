# Base movement patterns and synonyms.
# Each entry:
# - name: canonical movement label
#   patterns: list of regex fragments (joined with |)
#   tags: optional list (e.g., modality: weightlifting/gymnastics/monostructural)

- name: burpee
  patterns:
    - burpee
  tags: [gymnastics]

- name: row (erg)
  patterns:
    - calories? row(ed|ing)?
    - \brow for\b
    - \bcal(?:orie)?s? row\b
    - \brow,? cal(?:orie)?s?\b
    - \d+\s*m(?:eters)?\s*row
    - row\s+\d+\s*m(?:eters)?
    - rower\b
    - erg\b
  tags: [monostructural]

- name: run
  patterns:
    - \b(?:run|runs|running)\b
  tags: [monostructural]

- name: bike (assault/echo)
  patterns:
    - bike
    - assault
    - echo bike
  tags: [monostructural]

- name: ski erg
  patterns:
    - \bski\b
  tags: [monostructural]

- name: double under
  patterns:
    - double[- ]?unders?
    - \bdu\b
    - \bdus\b
    - \bd\s*/\s*u\b
    - \bdubs?\b
  tags: [monostructural]

- name: box jump
  patterns:
    - box jump
  tags: [gymnastics]

- name: wall ball
  patterns:
    - wall[- ]?balls?\b
  tags: [weightlifting]

- name: thruster
  patterns:
    - thruster
  tags: [weightlifting]

- name: deadlift
  patterns:
    - \bdeadlifts?\b
    - \brdl(?:s)?\b
  tags: [weightlifting]

- name: clean
  patterns:
    - \bcleans?\b
    - power clean
  tags: [weightlifting]

- name: snatch
  patterns:
    - \bsnatch
    - power snatch
  tags: [weightlifting]

- name: clean and jerk
  patterns:
    - \bclean(?:s)?\s*(?:and|&|\+|/)\s*jerks?\b
    - \bclean[- ]jerks?\b
  tags: [weightlifting]

- name: jerk (split/push)
  patterns:
    - \bjerk
  tags: [weightlifting]

- name: push press
  patterns:
    - push press
  tags: [weightlifting]

- name: strict press
  patterns:
    - strict press
    - shoulder press
  tags: [weightlifting]

- name: bench press
  patterns:
    - bench press
    - \bdb\s+bench(?:\s+press)?\b
    - \bdumbbell\s+bench(?:\s+press)?\b
  tags: [weightlifting]

- name: back squat
  patterns:
    - back squat
  tags: [weightlifting]

- name: front squat
  patterns:
    - front squat
  tags: [weightlifting]

- name: air squat
  patterns:
    - air squats?
    - \bairsquats?\b
    - bodyweight squats?
  tags: [gymnastics]

- name: overhead squat
  patterns:
    - overhead squat
  tags: [weightlifting]

- name: lunge
  patterns:
    - lunge
  tags: [weightlifting]

- name: sled push
  patterns:
    - sled push(?:es)?
    - prowler push(?:es)?
  tags: [conditioning]

- name: sled pull
  patterns:
    - sled pull(?:s)?
    - prowler pull(?:s)?
    - sled drag(?:s)?
  tags: [conditioning]

- name: rope climb
  patterns:
    - rope climb
  tags: [gymnastics]

- name: pull-up
  patterns:
    - pull[- ]?up
    - chin[- ]?up
  tags: [gymnastics]

- name: muscle-up
  patterns:
    - muscle[- ]?up
  tags: [gymnastics]

- name: toes-to-bar
  patterns:
    - toes[- ]?to[- ]?bar
    - ttb
  tags: [gymnastics]

- name: push-up
  patterns:
    - (?<!handstand )push[- ]?up
  tags: [gymnastics]

- name: handstand push-up
  patterns:
    - handstand (push[- ]?up|pushup)
    - hspu
  tags: [gymnastics]

- name: sit-up
  patterns:
    - sit[- ]?ups?
  tags: [gymnastics]

- name: kettlebell swing
  patterns:
    - kettlebell swing
    - kb swing
  tags: [weightlifting]

- name: kettlebell snatch
  patterns:
    - kettlebell snatch
    - kb snatch
  tags: [weightlifting]

- name: turkish get-up
  patterns:
    - turkish get[- ]?up
  tags: [weightlifting]

- name: dumbbell snatch
  patterns:
    - db snatch
    - dumbbell (?:power |hang )?snatch
    - db (?:power |hang )snatch
  tags: [weightlifting]

- name: dumbbell clean
  patterns:
    - db clean
    - dumbbell clean
  tags: [weightlifting]

- name: dumbbell thruster
  patterns:
    - db thruster
    - dumbbell thruster
  tags: [weightlifting]

- name: row (weighted)
  patterns:
    - db row
    - dumbbell row
    - barbell row
    - bent[- ]?over row
    - pendlay row
    - seal row
    - three[- ]point db row
    - renegade rows?
    - renegade (?:db|dumbbell) rows?
  tags: [weightlifting]

- name: ring row
  patterns:
    - \bring rows?\b

- name: handstand walk
  patterns:
    - \bhandstand walk(?:s|ing)?\b
    - \bhsw\b

- name: wall walk
  patterns:
    - \bwall walks?\b

- name: ground-to-overhead
  patterns:
    - \bground[- ]to[- ]overheads?\b
    - \bgtoh\b

- name: shoulder-to-overhead
  patterns:
    - \bshoulder[- ]to[- ]overheads?\b
    - \bstoh\b

- name: sumo deadlift high pull
  patterns:
    - \bsumo deadlift high[- ]pulls?\b
    - \bsdhp\b

- name: hollow rock
  patterns:
    - \bhollow rocks?\b

- name: single under
  patterns:
    - \bsingle[- ]unders?\b

- name: cluster
  patterns:
    - \b(?:\d+\s+clusters?|clusters?\s+\d+)\b

- name: goblet squat
  patterns:
    - \bgoblet squats?\b

- name: knees-to-elbows
  patterns:
    - \bknees?[- ]to[- ]elbows?\b

- name: v-up
  patterns:
    - \bv[- ]?ups?\b

- name: tuck-up
  patterns:
    - \btuck[- ]?ups?\b

- name: hollow hold
  patterns:
    - \bhollow holds?\b

- name: dip
  patterns:
    - \b(?:(?:ring|bar|strict) dips?|\d+\s+dips?)\b

- name: plank
  patterns:
    - \bplanks?\b

- name: squat (unspecified)
  patterns:
    - ^(?:\d+\s+)?squats?$

- name: press (unspecified)
  patterns:
    - ^press$
